name: iuna
description: "Iuna — a gacha-style Japanese vocabulary app with spaced repetition and an optional AI tutor."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.20.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Audio (Japanese TTS via Android's TextToSpeech)
  flutter_tts: ^4.2.0

  # Backup (Google Drive appDataFolder)
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.2

  # Utilities
  intl: ^0.20.2
  file_picker: ^8.1.2
  crypto: ^3.0.5
  flutter_secure_storage: ^10.3.2
  flutter_markdown_plus: ^1.0.12
  record: ^6.2.1

  # Photo attachments in the Learn chats (camera + gallery).
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  drift_dev: ^2.20.0
  build_runner: ^2.4.13

  # Used by tools/ (JMdict streaming XML importer, CLI flags).
  xml: ^6.5.0
  args: ^2.5.0

  # Used by test/helpers/fake_path_provider.dart.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true

  assets:
    - assets/db/seed.sqlite
    - assets/learn/prompts/
    - assets/learn/skills/

