name: Release

# Bumping `version:` in pubspec.yaml on main is the release: when no
# vX.Y.Z tag exists for that version yet, this tags the commit, builds a
# release-signed APK and publishes it as a GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: New version?
        id: version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - if: steps.version.outputs.release == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true

      - if: steps.version.outputs.release == 'true'
        run: flutter pub get
      - if: steps.version.outputs.release == 'true'
        run: flutter analyze
      - if: steps.version.outputs.release == 'true'
        run: flutter test --exclude-tags golden

      # Without these the Gradle build silently falls back to the debug
      # key, which would ship an APK that can't upgrade existing installs.
      - name: Release keystore
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "Missing secret for $v"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - if: steps.version.outputs.release == 'true'
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk "iuna-${{ steps.version.outputs.tag }}.apk"

      - if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: iuna-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
