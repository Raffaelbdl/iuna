<?xml version="1.0" encoding="UTF-8"?>
<!--
  Black Kuma mascot. Coordinates mirror the CustomPainter at
  lib/widgets/kuma_mascot.dart (KumaVariant.black) so this file and the
  in-app render stay visually identical.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Ears (body + mint inner) -->
  <circle cx="26" cy="26" r="11" fill="#2A2530"/>
  <circle cx="74" cy="26" r="11" fill="#2A2530"/>
  <circle cx="26" cy="26" r="5.5" fill="#AEE0D8"/>
  <circle cx="74" cy="26" r="5.5" fill="#AEE0D8"/>

  <!-- Head -->
  <circle cx="50" cy="54" r="32" fill="#2A2530"/>

  <!-- Muzzle patch -->
  <ellipse cx="50" cy="62" rx="11" ry="8" fill="#3A3340"/>

  <!-- Eyes -->
  <circle cx="40" cy="50" r="2.6" fill="#0A0500"/>
  <circle cx="60" cy="50" r="2.6" fill="#0A0500"/>

  <!-- Nose -->
  <ellipse cx="50" cy="58" rx="1.6" ry="1.2" fill="#0A0500"/>

  <!-- Ribbon collar -->
  <path d="M30,86 Q50,80 70,86 L70,92 Q50,86 30,92 Z" fill="#AEE0D8"/>
  <path d="M22,88 Q30,84 36,88 Q30,92 22,92 Z" fill="#AEE0D8"/>
  <path d="M78,88 Q70,84 64,88 Q70,92 78,92 Z" fill="#AEE0D8"/>

  <!-- Charm disc -->
  <circle cx="50" cy="88" r="3.2" fill="#D4A85E" stroke="#7FC4BA" stroke-width="0.5"/>
  <line x1="48" y1="86" x2="52" y2="90" stroke="#7FC4BA" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="52" y1="86" x2="48" y2="90" stroke="#7FC4BA" stroke-width="0.8" stroke-linecap="round"/>
</svg>
